name: Bump version

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  gitversion:
    name: Execute GitVersion and create tag
    uses: bvandevliet/Actions.Shared/.github/workflows/git-version.yml@master
    permissions:
      contents: write
    with:
      createTag: false

  bump:
    name: Bump plugin manifest versions
    needs: gitversion
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@main

      - name: "Check for em dashes"
        shell: pwsh
        run: ./scripts/check-em-dash.ps1

      - name: "Sync plugin manifest versions"
        if: ${{ env.IS_MAIN == 'true' }}
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = '${{ needs.gitversion.outputs.majorMinorPatch }}';

            const bumpVersion = (filePath) => {
              const manifest = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              manifest.version = version;
              fs.writeFileSync(filePath, JSON.stringify(manifest, null, 2) + '\n');
            };

            bumpVersion('.claude-plugin/marketplace.json');

            for (const entry of fs.readdirSync('plugins', { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const pluginManifest = path.join('plugins', entry.name, '.claude-plugin', 'plugin.json');
              if (fs.existsSync(pluginManifest)) bumpVersion(pluginManifest);
            }
          "

      - name: "Commit plugin manifest version bump"
        if: ${{ env.IS_MAIN == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(plugin): bump manifest version to ${{ needs.gitversion.outputs.majorMinorPatch }} [skip ci]"
          file_pattern: ".claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json"
          tag_name: ${{ needs.gitversion.outputs.majorMinorPatch }}
