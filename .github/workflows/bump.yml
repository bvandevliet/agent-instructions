name: Bump version

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  gitversion:
    name: Execute GitVersion and create tag
    uses: bvandevliet/Actions.Shared/.github/workflows/git-version.yml@master
    permissions:
      contents: write
    with:
      createTag: false

  bump:
    name: Bump plugin manifest versions
    needs: gitversion
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      IS_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@main

      - name: "Sync plugin manifest versions"
        if: ${{ env.IS_MAIN == 'true' }}
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ needs.gitversion.outputs.majorMinorPatch }}';

            const pluginPaths = ['.claude-plugin/plugin.json', '.github/plugin/plugin.json'];
            for (const path of pluginPaths) {
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              manifest.version = version;
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
            }

            const marketplacePaths = ['.claude-plugin/marketplace.json', '.github/plugin/marketplace.json'];
            for (const path of marketplacePaths) {
              const marketplace = JSON.parse(fs.readFileSync(path, 'utf8'));
              for (const plugin of marketplace.plugins) {
                plugin.version = version;
              }
              fs.writeFileSync(path, JSON.stringify(marketplace, null, 2) + '\n');
            }
          "

      - name: "Commit plugin manifest version bump"
        if: ${{ env.IS_MAIN == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(plugin): bump manifest version to ${{ needs.gitversion.outputs.majorMinorPatch }} [skip ci]"
          file_pattern: ".claude-plugin/plugin.json .claude-plugin/marketplace.json .github/plugin/plugin.json .github/plugin/marketplace.json"
          tag_name: ${{ needs.gitversion.outputs.majorMinorPatch }}
